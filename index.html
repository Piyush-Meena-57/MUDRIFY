        :root {

            --mut: #A3B4E6;

            --bd: rgba(130, 160, 255, .28);
            --hero: linear-gradient(145deg, rgba(40, 70, 180, .6), rgba(20, 30, 110, .6));
            --heromut: #B9C8FF;

            --acc: #F5B83D;

            --glow1: rgba(54, 90, 255, .38);
            --glow2: rgba(124, 108, 255, .28)

            --tx: #E9FBF4;

            --pri: #2EE59D;
            --onpri: #03170F;

            --in: #5EF2BA;
            --out: #FF7B9A;
            --outg: linear-gradient(135deg, #FF9DB4, #FF6F92);
            --bd: rgba(80, 230, 170, .28);
            --hero: linear-gradient(145deg, rgba(18, 110, 86, .6), rgba(6, 50, 40, .65));
            --heromut: #BFEBD9;
            --tint: rgba(60, 230, 160, .18);
            --wave: rgba(60, 230, 170, .38);
            --glow1: rgba(20, 200, 140, .36);
            --glow2: rgba(60, 240, 180, .2)

        :root[data-ui="light"] {

            --bg: #F3F6FC;
            --card: rgba(255, 255, 255, .92);
            --solid: #FFFFFF;
            --tx: #0E1B3D;
            --mut: #4C5E86;
            --pri: #3350D4;
            --onpri: #FFFFFF;
            --grad: linear-gradient(135deg, #4A6BFF, #3350D4);
            --in: #08795A;
            --out: #C0263F;
            --outg: linear-gradient(135deg, #D9405A, #C0263F);
            --onout: #FFFFFF;
            --bd: rgba(30, 60, 140, .16);
            --hero: linear-gradient(145deg, #3B58D8, #2B3FA8);
            --heromut: #D5DEFF;

            --wave: rgba(51, 80, 212, .2);

        html {

        }

        body {

        .chip {

        }

        .bars {

        .mc {

            gap: 2px
        }

            border-radius: 3px 3px 0 0;

        body {
            font-family: "Inter", "Noto Sans Devanagari", system-ui, sans-serif

        .conn span {

        .acc {

        }

        .step {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--pri);
            color: var(--onpri);

        }

        .cat span {
            width: 54px;

            border-radius: 50%;
            background: var(--tint);

        }

        .cat.on span {
            background: rgba(255, 255, 255, .28)
        }

        nav {
            border-radius: 22px 22px 0 0;
            box-shadow: 0 -4px 16px rgba(30, 27, 75, .1)
        }

        nav .on {
            background: var(--tint);

        }

        .pie {
            width: 160px;
            height: 160px;
            border-radius: 50%;

            place-items: center
        }

        .pie i {
            width: 90px;
            height: 90px;
            border-radius: 50%;

        .dot {

            max-width: 100%;

        }

        .fab {
            position: fixed;
            right: 20px;
            bottom: calc(88px + env(safe-area-inset-bottom, 0px));
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--pri);
            color: var(--onpri);
            border: 0;
            font-size: 36px;
            line-height: 1;
            box-shadow: 0 6px 18px rgba(30, 27, 75, .35);
            cursor: pointer;
            z-index: 4
        }

        .seg {
            display: flex;
            background: var(--tint);
            border-radius: 28px;
            padding: 4px;
            margin: 10px 0
        }

        .seg button {
            flex: 1;
            min-height: 48px;
            border: 0;
            border-radius: 24px;
            background: none;
            color: var(--tx);
            font: inherit;
            font-weight: 700;
            cursor: pointer
        }

        .seg .on {
            background: var(--pri);
            color: var(--onpri)
        }

        .gbtn {
            background: #FFFFFF;
            color: #1F1F1F;
            border: 1px solid #DADCE0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px
        }

        .otp {
            font-size: 32px;
            text-align: center;
            letter-spacing: 10px;
            font-weight: 800
        }

        .ck1 {
            stroke-dasharray: 151;
            stroke-dashoffset: 151;
            animation: dr .6s ease forwards
        }

        .ck2 {
            stroke-dasharray: 40;
            stroke-dashoffset: 40;
            animation: dr .4s .5s ease forwards
        }

        @keyframes dr {
            to {
                stroke-dashoffset: 0
            }
        }

        .wel {
            animation: pop .9s ease both
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(.85)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @media (prefers-reduced-motion:reduce) {

            .ck1,
            .ck2,
            .wel {
                animation: none;
                stroke-dashoffset: 0
            }
        }

        .notif {
            position: fixed;
            left: 12px;
            right: 12px;
            top: calc(10px + env(safe-area-inset-top, 0px));
            max-width: 496px;
            margin: 0 auto;
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 18px;
            padding: 12px 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
            z-index: 9;
            animation: slide .35s ease
        }

        @keyframes slide {
            from {
                transform: translateY(-130%)
            }

            to {
                transform: none
            }
        }

        nav button {
            font-size: 13px;
            padding: 0 2px
        }

        #app {
            position: relative;
            z-index: 1;
            padding-bottom: 130px
        }

        .bgfx {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden
        }

        .bgfx svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%
        }

        .bgfx .w {
            fill: none;
            stroke: var(--wave);
            stroke-width: 1.2
        }

        .bgfx::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 65%;
            height: 38%;
            background: radial-gradient(circle, var(--wave) 1px, transparent 1.7px) 0 0/16px 16px;
            opacity: .5;
            -webkit-mask-image: linear-gradient(135deg, #000, transparent 72%);
            mask-image: linear-gradient(135deg, #000, transparent 72%)
        }

        .card,
        nav,
        .notif {
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px)
        }

        .card {
            box-shadow: 0 6px 24px rgba(0, 0, 0, .18)
        }

        .pri {
            background: var(--grad);
            border-color: transparent
        }

        .red {
            background: var(--outg);
            border-color: transparent;
            color: var(--onout)
        }

        .pie i {
            background: var(--solid)
        }

        .hero {
            position: relative;
            overflow: hidden;
            background: var(--hero);
            border: 1px solid var(--bd);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .25)
        }

        .hero .mut {

        }

        .hico {
            position: absolute;
            right: 14px;
            top: 14px;
            width: 84px;
            height: 64px;
            opacity: .55;
            pointer-events: none
        }

        .hbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 14px;
            margin: 0 0 6px
        }

        nav {

        }

        .fab {
            bottom: calc(98px + env(safe-area-inset-bottom, 0px));
            background: var(--grad)
        }

        .btn {
            margin: 9px 0
        }

        .big {
            margin: 10px 0
        }

        .seg {
            margin: 14px 0
        }

        .seg button {
            font-size: 15px
        }

        input,
        textarea {
            margin: 8px 0
        }

        .sw {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px
        }

        .swb {
            font: inherit;
            font-weight: 700;
            font-size: 14px;
            border-radius: 18px;
            border: 2px solid var(--bd);
            background: var(--card);
            color: var(--tx);
            padding: 10px 6px;
            cursor: pointer;
            display: flex;

            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--bd)
        }

        .swb.on {
            border-color: var(--pri)
        }

        :root {
            --bgimg: url(bg-navy-p.jpg);
            --scrim: rgba(4, 10, 28, .3)
        }

        :root[data-ui="emerald"] {
            --bgimg: url(bg-teal-p.jpg);
            --scrim: rgba(2, 16, 13, .3)
        }

        :root[data-ui="light"] {
            --bgimg: url(bg-light-p.jpg);
            --scrim: rgba(243, 246, 252, .3)
        }

        @media (orientation:landscape) {
            :root {
                --bgimg: url(bg-navy-l.jpg)
            }

            :root[data-ui="emerald"] {
                --bgimg: url(bg-teal-l.jpg)
            }

            :root[data-ui="light"] {
                --bgimg: url(bg-light-l.jpg)
            }
        }

        .bgfx {
            background: var(--bgimg) center/cover no-repeat, var(--bg)
        }

        .bgfx::before {
            display: none
        }

        .bgfx::after {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--scrim)
        }

        .seg {
            padding: 3px;

        }

        }

            min-height: 40px
        }

        .btn {
            min-height: 52px
        }

        .big {
            min-height: 64px;

        }

        .two .big {
            min-height: 76px;

        }

            min-height: 46px
        }

        nav button span {
            font-size: 22px
        }

        .fab {

        }

        select {
            font: inherit;
            min-height: 52px;
            width: 100%;
            box-sizing: border-box;
            border: 2px solid var(--bd);
            background: var(--solid);
            color: var(--tx);
            border-radius: 14px;
            padding: 8px 12px;
            margin: 8px 0
        }

        option {
            background: var(--solid);
            color: var(--tx)
        }

        [hidden] {
            display: none !important
        }

        :root {
            --mglow: rgba(70, 140, 255, .6)
        }

        :root[data-ui="emerald"] {
            --mglow: rgba(46, 229, 157, .55)
        }

        :root[data-ui="light"] {
            --mglow: rgba(51, 80, 212, .45)
        }

        .mdb {
            position: fixed;
            z-index: 12;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            padding: 0;
            border: 2px solid var(--pri);
            background: var(--solid);
            cursor: grab;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            will-change: left, top;
            animation: mdb 3.2s ease-in-out infinite;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .35), 0 0 18px var(--mglow)
        }

        .mdb img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
            pointer-events: none
        }

        .mdb.drag {
            cursor: grabbing;
            animation: none;
            transform: scale(1.08)
        }

        .mdb.snap {
            transition: left .28s cubic-bezier(.2, .9, .3, 1), top .28s cubic-bezier(.2, .9, .3, 1)
        }

        @keyframes mdb {

            0%,
            100% {
                box-shadow: 0 6px 20px rgba(0, 0, 0, .35), 0 0 10px var(--mglow)
            }

            50% {
                box-shadow: 0 6px 24px rgba(0, 0, 0, .35), 0 0 26px var(--mglow)
            }
        }

        .mdp {
            position: fixed;
            z-index: 30;
            left: 0;
            right: 0;
            bottom: 0;
            height: min(80vh, 660px);
            display: flex;
            flex-direction: column;
            background: var(--solid);
            color: var(--tx);
            border: 1px solid var(--bd);
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, .45), 0 0 30px var(--mglow);
            animation: mdup .28s ease
        }

        @keyframes mdup {
            from {
                transform: translateY(30px);
                opacity: 0
            }

            to {
                transform: none;
                opacity: 1
            }
        }

        @media (min-width:640px) {
            .mdp {
                left: auto;
                right: 20px;
                bottom: 20px;
                width: 390px;
                height: min(76vh, 600px);
                border-radius: 24px
            }
        }

            display: flex;
            align-items: center;
            gap: 10px;

        .mdm {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .mdmsg {
            max-width: 86%;
            padding: 10px 12px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.45;
            word-wrap: break-word
        }

        .mdmsg.bot {
            background: var(--tint);
            border: 1px solid var(--bd);
            align-self: flex-start;
            border-bottom-left-radius: 4px
        }

        .mdmsg.me {
            background: var(--grad);
            color: var(--onpri);
            align-self: flex-end;
            border-bottom-right-radius: 4px
        }

        .mdtag {
            display: block;
            margin-top: 6px;
            font-size: 12px;
            opacity: .75
        }

        .mdsug {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 6px 14px
        }

        .mdsug button {
            flex: 0 0 auto;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            min-height: 40px;
            border-radius: 20px;
            border: 1px solid var(--pri);
            background: var(--card);
            color: var(--tx);
            padding: 6px 14px;
            cursor: pointer;
            white-space: nowrap
        }

        .mdin {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid var(--bd)
        }

        .mdin input {
            margin: 0;
            min-height: 48px;
            flex: 1
        }

        .mdin button {
            font: inherit;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid var(--bd);
            background: var(--tint);
            color: var(--tx);
            font-size: 20px;
            cursor: pointer;
            flex: 0 0 auto
        }

        .mdin #mdSend {
            background: var(--grad);
            color: var(--onpri);
            border-color: transparent;
            font-weight: 800
        }

        @media (prefers-reduced-motion:reduce) {
            .mdb {
                animation: none
            }

            .mdp {
                animation: none
            }

            .mdb.snap {
                transition: none
            }
        }

        .mdh {
            cursor: grab;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            background: var(--tint)
        }

        .mdh.dragging {
            cursor: grabbing
        }

        .mdh img {
            pointer-events: none;
            object-fit: cover
        }

        .mdh .mdx {
            cursor: pointer
        }

        .mdp {
            box-sizing: border-box
        }

        .mdp.mdfree {
            right: auto;
            bottom: auto;
            border-radius: 24px;
            animation: none
        }

        .mdp,
        .mdb,
        .mdmsg,
        .mdh,
        .mdin input,
        .mdsug button,
        .mdx {
            transition: background-color .25s, border-color .25s, color .25s, box-shadow .25s
        }

        .mdin input::placeholder {
            color: var(--mut);
            opacity: .85
        }

        .mdb img {
            object-fit: cover
        }

        @media (prefers-reduced-motion:reduce) {

            .mdp,
            .mdb,
            .mdmsg,
            .mdh,
            .mdin input,
            .mdsug button,
            .mdx {
                transition: none
            }
        }

        #rpt {
            display: none
        }

        #rpt {
            display: none
        }

        @page {
            size: A4;
            margin: 14mm 12mm 16mm;

            @bottom-center {
                content: "MUDRIFY · Page " counter(page) " / " counter(pages);
                font: 9px Arial, sans-serif;
                color: #667
            }
        }

        @media print {
            body>*:not(#rpt) {
                display: none !important
            }

            html,
            body {
                background: #fff !important;
                color-scheme: light
            }

            #rpt {
                display: block !important;
                color: #14203f;
                font: 12px/1.45 "Inter", "Noto Sans Devanagari", Arial, sans-serif;
                padding: 0;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact
            }

            #rpt * {
                box-sizing: border-box
            }

            #rpt .rh {
                display: flex;
                align-items: center;
                gap: 14px;
                padding-bottom: 12px;
                border-bottom: 3px solid #1f3fbf
            }

            #rpt .rh img {
                width: 52px;
                height: 52px;
                object-fit: contain;
                flex: 0 0 auto
            }

            #rpt .rb {
                flex: 1;
                min-width: 0
            }

            #rpt .rn {
                font-size: 26px;
                font-weight: 800;
                letter-spacing: 3px;
                color: #1f3fbf;
                line-height: 1.1
            }

            #rpt .rt {
                font-size: 13px;
                color: #4c5e86
            }

            #rpt .rm {
                text-align: right;
                font-size: 12px;
                line-height: 1.5
            }

            #rpt .rm b {
                font-size: 15px;
                color: #14203f
            }

            #rpt h2 {
                font-size: 14px;
                margin: 20px 0 8px;
                color: #1f3fbf;
                padding-bottom: 4px;
                border-bottom: 1.5px solid #c9d3f5;
                break-after: avoid
            }

            #rpt .sg {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 8px
            }

            #rpt .sc {
                border: 1px solid #d5dcf2;
                background: #f5f7fe;
                border-radius: 8px;
                padding: 8px 10px;
                break-inside: avoid
            }

            #rpt .sc span {
                display: block;
                font-size: 10.5px;
                color: #4c5e86
            }

            #rpt .sc b {
                font-size: 16px;
                white-space: nowrap
            }

            #rpt table {
                width: 100%;
                border-collapse: collapse;
                table-layout: fixed
            }

            #rpt thead {
                display: table-header-group
            }

            #rpt tfoot {
                display: table-footer-group
            }

            #rpt tr {
                break-inside: avoid;
                page-break-inside: avoid
            }

            #rpt th {
                background: #1f3fbf !important;
                color: #fff !important;
                font-size: 10.5px;
                text-transform: uppercase;
                letter-spacing: .5px;
                padding: 6px 7px;
                text-align: left
            }

            #rpt td {
                padding: 6px 7px;
                border-bottom: 1px solid #e1e6f5;
                vertical-align: top;
                word-wrap: break-word;
                overflow-wrap: anywhere
            }

            #rpt tbody tr:nth-child(even) td {
                background: #f8f9fe
            }

            #rpt .r {
                text-align: right;
                white-space: nowrap
            }

            #rpt .g {
                color: #08795a
            }

            #rpt .rd {
                color: #c0263f
            }

            #rpt .pill {
                display: inline-block;
                padding: 1px 8px;
                border-radius: 10px;
                font-size: 10px;
                font-weight: 700
            }

            #rpt .pill.g {
                background: #d9f5ec
            }

            #rpt .pill.rd {
                background: #fde2e8
            }

            #rpt .bar {
                height: 8px;
                border-radius: 4px;
                background: #3350d4
            }

            #rpt .tr {
                background: #e6e9f5;
                height: 8px;
                border-radius: 4px
            }

            #rpt .fin {
                margin-top: 22px;
                border: 2px solid #1f3fbf;
                border-radius: 10px;
                overflow: hidden;
                break-inside: avoid;
                page-break-inside: avoid
            }

            #rpt .fin .fh {
                background: #1f3fbf !important;
                color: #fff;
                font-weight: 800;
                padding: 7px 12px;
                font-size: 13px
            }

            #rpt .fin .fr {
                display: flex;
                justify-content: space-between;
                padding: 7px 12px;
                border-bottom: 1px solid #e1e6f5;
                font-size: 13px
            }

            #rpt .fin .fb {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px;
                font-size: 17px;
                font-weight: 800;
                background: #eef2ff !important
            }

            #rpt .fin .fb b {
                font-size: 22px
            }

            #rpt .ft {
                margin-top: 16px;
                font-size: 10px;
                color: #667;
                text-align: center
            }

            #rpt .em {
                text-align: center;
                color: #667;
                padding: 14px
            }
        }
    </style>
</head>
