<script>
var K='mera_hisaab_v1',S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S)S={lang:'hi',name:'',mode:'',tx:[],ud:[],theme:''};
function save(){S.ts=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(window.FB&&window.CU)window.FB.push()}
if(S.theme)document.documentElement.dataset.theme=S.theme;
var L=function(h,e){return S.lang=='hi'?h:e};
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return '₹'+Math.abs(n).toLocaleString('en-IN')}
function pad(n){return(n<10?'0':'')+n}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
var V={view:'home',step:0,month:today().slice(0,7),type:'out',cat:'',del:0,err:'',amt:'',note:'',date:'',toast:'',rs:0,f:'all',w:'',sms:'',rc:'',rv:0,bk:'',lock:!!(S.pin||S.bio),am:'in',em:'',sms2:'',src:'',meth:'email',ph:'',id:'',fn:'',dob:'',gd:'',pm:'',ost:'',ex:0,nr:0,otpmode:'up',cd:0,bt:0,pinonly:0,t1:0,t2:0,bioAv:null,lm:'email'};
var AR=false;
var DEMO_OTP=true,DOTP=null,DEV_NAME='Piyush Meena',DIP=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();DIP=e;render()});
window.addEventListener('appinstalled',function(){DIP=null;render()});
function freshS(){return {lang:'hi',langSet:false,name:'',mode:'',tx:[],ud:[],ts:0}}
function wipeAll(){S=freshS();try{localStorage.removeItem(K);localStorage.removeItem('mud_email')}catch(e){}try{document.documentElement.removeAttribute('data-theme')}catch(e){}V.view='home';V.ost='';V.am='in';V.meth='email';V.lm='email';V.err='';V.lock=0;V.pinonly=0;V.pop=null;V.ex=0;V.nr=0;V.id='';V.em='';V.ph='';V.q='';V.dm=0;DOTP=null;V.bk='';V.fn='';V.dob='';V.gd='';V.pm='';V.rs=0;V.cat='';V.amt='';V.note=''}
function banner(w){return '<img src="brand.png" alt="MUDRIFY: Plan, Track, Grow" style="display:block;width:100%;max-width:'+w+'px;margin:0 auto;border-radius:24px;background:rgba(0,0,0,.28);border:1px solid var(--bd);padding:6px">'}
function logo(n){return '<img src="icon-192.png" width="'+n+'" height="'+n+'" alt="MUDRIFY logo" style="border-radius:22%;display:block;margin:0 auto 8px">'}
function credit(){return '<p class="mut" style="text-align:center;margin-top:28px">'+L('बनाने वाले: ','Created by ')+'<b>'+DEV_NAME+'</b></p>'}
function isInst(){try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}}
function instBtn(){return isInst()?'':'<button class="btn" data-a="inst" style="margin-top:12px">⬇️ '+L('ऐप डाउनलोड / इंस्टॉल करें','Download / Install the app')+'</button>'}
function instHelp(){return V.ih&&!isInst()?'<div class="card"><p>'+L('Android (Chrome): ऊपर दाएँ ⋮ मेन्यू → "Install app" या "Add to Home screen"।','Android (Chrome): top-right ⋮ menu → "Install app" or "Add to Home screen".')+'</p><p>'+L('iPhone (Safari): Share बटन → "Add to Home Screen"।','iPhone (Safari): Share button → "Add to Home Screen".')+'</p></div>':''}
function aboutCard(){return '<div class="card" style="text-align:center">'+logo(56)+'<b style="letter-spacing:2px;color:var(--pri)">MUDRIFY</b><div class="mut">Make Money Make Sense · v1.0</div><img src="me.jpg" alt="" width="64" height="64" style="border-radius:50%;object-fit:cover;display:block;margin:10px auto 0" onerror="this.remove()"><div style="margin-top:8px">'+L('बनाने वाले: ','Created by ')+'<b>'+DEV_NAME+'</b></div></div>'}
try{if(window.PublicKeyCredential&&PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable)PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function(x){V.bioAv=x},function(){})}catch(e){}
var C={pout:[['🍚','खाना','Food'],['🚌','सफर','Travel'],['💡','बिल','Bills'],['💊','दवाई','Medicine'],['🛍️','खरीदारी','Shopping'],['📚','पढ़ाई','School'],['📦','और','Other']],
pin:[['💼','कमाई','Earnings'],['🎁','घर से मिला','From family'],['💰','और','Other']],
bout:[['📦','माल खरीदा','Stock bought'],['👷','मजदूरी','Wages'],['🏠','किराया','Rent'],['🚚','ढुलाई','Transport'],['💡','बिजली/बिल','Bills'],['🔧','और','Other']],
bin:[['🛒','बिक्री','Sales'],['🤝','उधार वसूली','Credit received'],['💰','और','Other']]};
function cl(k){return C[k.slice(0,-1)][+k.slice(-1)]}

function sum(l,t){return l.filter(function(x){return x.type==t}).reduce(function(a,x){return a+x.amt},0)}
function mlabel(m){var p=m.split('-');return new Date(p[0],p[1]-1,1).toLocaleDateString(S.lang=='hi'?'hi-IN':'en-IN',{month:'long',year:'numeric'})}
function balLabel(b){var bz=S.mode=='business';return b>=0?(bz?L('मुनाफ़ा','Profit'):L('बचत','Savings')):(bz?L('नुकसान','Loss'):L('कमी','Shortfall'))}

function vWelcome(){return '<div style="font-weight:800;font-size:30px;letter-spacing:2px;color:var(--pri)">MUDRIFY</div><div class="mut" style="letter-spacing:1px">MAKE MONEY MAKE SENSE</div><h1>🙏 '+L('नमस्ते!','Welcome!')+'</h1><p class="mut">'+L('अपना खर्चा और कमाई आसानी से लिखें','Write your income and expenses easily')+'</p>'+langBtns()+'<h2>'+L('आपका नाम क्या है?','What is your name?')+'</h2><input id="nm" value="'+esc(S.name)+'" autocomplete="name" placeholder="'+L('यहाँ नाम लिखें','Type name here')+'">'+(V.err?'<p class="err">'+V.err+'</p>':'')+'<button class="btn pri big" data-a="next">'+L('आगे बढ़ें ➡️','Next ➡️')+'</button>'}
